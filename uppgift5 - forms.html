<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Formulär</title>
</head>

<body>

    <h1>Mitt Formulär</h1>

    <form action="tack.html">

        <fieldset>
            <legend>Personlig information</legend>

            <label for="namn">Namn:</label><br>
            <input type="text" id="namn" name="namn" value="Noor"><br><br>

            <label for="epost">E-post:</label><br>
            <input type="text" id="epost" name="epost"><br><br>

            <label for="anime">Favoritanime:</label><br>
            <select id="anime" name="anime">
                <option value="naruto">Naruto</option>
                <option value="onepiece">One Piece</option>
                <option value="aot">Attack on Titan</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend>Övriga frågor</legend>

            <p>Vilket kön identifierar du dig som?</p>

            <input type="radio" id="man" name="kon" value="man">
            <label for="man">Man</label><br>

            <input type="radio" id="kvinna" name="kon" value="kvinna">
            <label for="kvinna">Kvinna</label><br><br>

            <input type="checkbox" id="nyhetsbrev" name="nyhetsbrev">
            <label for="nyhetsbrev">Jag vill prenumerera på nyhetsbrev</label><br><br>
        </fieldset>

        <br>

        <input type="submit" value="Skicka formulär">

    </form>

</body>
